# Baut die Seite, bringt das Datenbankschema auf den neuesten Stand und veröffentlicht sie als Cloudflare Worker.
# Die Rezepte liegen in D1, ein Push ist nur für Änderungen am Code nötig.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nie zwei Deploys gleichzeitig; ein neuerer ersetzt einen wartenden.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Seite bauen
        run: npm run build

      # Spielt neue Dateien aus migrations/ in die echte Datenbank ein. Schon eingespielte werden übersprungen.
      - name: Datenbankschema aktualisieren
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply rezepte --remote

      # Name, Datenbank und Domain stehen in wrangler.jsonc.
      - name: Auf Cloudflare veröffentlichen
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
